div>\n        <span class=\"badge bg-danger px-3 py-1 rounded-pill mb-1\">Area Administrator<\/span>\n        <h2 class=\"fw-bold mb-1\">Dashboard Pengelolaan Cafe<\/h2>\n        <p class=\"text-muted small mb-0\">Ringkasan operasional dan transaksi pesanan cafe secara real-time<\/p>\n    <\/div>\n    <div class=\"d-flex flex-wrap gap-2\">\n        <a href=\"<?php echo base_url('admin/menus.php'); ?>\" class=\"btn btn-warning rounded-pill px-4 py-2 fw-bold\">\n            <i class=\"bi bi-grid-fill me-1\"><\/i> Kelola Menu\n        <\/a>\n        <a href=\"<?php echo base_url('admin/orders.php'); ?>\" class=\"btn btn-dark rounded-pill px-4 py-2\">\n            <i class=\"bi bi-receipt me-1\"><\/i> Semua Pesanan\n        <\/a>\n        <a href=\"<?php echo base_url('admin/reports.php'); ?>\" class=\"btn btn-outline-dark rounded-pill px-3 py-2\">\n            <i class=\"bi bi-bar-chart me-1\"><\/i> Laporan\n        <\/a>\n    <\/div>\n<\/div>\n\n<!-- Kartu Statistik (PRD Section 16 & Soal UKK) -->\n<div class=\"row g-3 mb-4\">\n    <div class=\"col-sm-6 col-lg-3\">\n        <div class=\"card stat-card shadow-sm border-0 p-3 bg-white\">\n            <div class=\"d-flex align-items-center gap-3\">\n                <div class=\"stat-icon-box bg-dark bg-opacity-10 text-dark\">\n                    <i class=\"bi bi-receipt-cutoff\"><\/i>\n                <\/div>\n                <div>\n                    <h6 class=\"text-muted small mb-0\">Total Pesanan<\/h6>\n                    <h3 class=\"fw-bold mb-0\"><?php echo $totalOrders; ?><\/h3>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <div class=\"col-sm-6 col-lg-3\">\n        <div class=\"card stat-card shadow-sm border-0 p-3 bg-white\">\n            <div class=\"d-flex align-items-center gap-3\">\n                <div class=\"stat-icon-box bg-warning bg-opacity-25 text-dark\">\n                    <i class=\"bi bi-hourglass-split\"><\/i>\n                <\/div>\n                <div>\n                    <h6 class=\"text-muted small mb-0\">Perlu Diproses<\/h6>\n                    <h3 class=\"fw-bold mb-0 text-warning\"><?php echo $pendingOrders; ?><\/h3>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <div class=\"col-sm-6 col-lg-3\">\n        <div class=\"card stat-card shadow-sm border-0 p-3 bg-white\">\n            <div class=\"d-flex align-items-center gap-3\">\n                <div class=\"stat-icon-box bg-primary bg-opacity-10 text-primary\">\n                    <i class=\"bi bi-arrow-repeat\"><\/i>\n                <\/div>\n                <div>\n                    <h6 class=\"text-muted small mb-0\">Sedang Dimasak<\/h6>\n                    <h3 class=\"fw-bold mb-0 text-primary\"><?php echo $processingOrders; ?><\/h3>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n    <div class=\"col-sm-6 col-lg-3\">\n        <div class=\"card stat-card shadow-sm border-0 p-3 bg-white\">\n            <div class=\"d-flex align-items-center gap-3\">\n                <div class=\"stat-icon-box bg-success bg-opacity-10 text-success\">\n                    <i class=\"bi bi-cash-stack\"><\/i>\n                <\/div>\n                <div>\n                    <h6 class=\"text-muted small mb-0\">Pendapatan Selesai<\/h6>\n                    <h5 class=\"fw-bold mb-0 text-success\"><?php echo format_rupiah($totalIncome); ?><\/h5>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<!-- Tabel Pesanan Terbaru -->\n<div class=\"card border-0 shadow-sm\">\n    <div class=\"card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center\">\n        <h5 class=\"fw-bold mb-0\"><i class=\"bi bi-bell-fill text-warning me-2\"><\/i>Pesanan Masuk Terbaru<\/h5>\n        <a href=\"<?php echo base_url('admin/orders.php'); ?>\" class=\"btn btn-sm btn-outline-dark rounded-pill px-3\">\n            Lihat Semua Pesanan <i class=\"bi bi-arrow-right ms-1\"><\/i>\n        <\/a>\n    <\/div>\n    <div class=\"card-body p-0\">\n        <?php if (empty($recentOrders)): ?>\n            <div class=\"text-center py-5\">\n                <i class=\"bi bi-inbox fs-1 text-muted\"><\/i>\n                <p class=\"text-muted mt-2 mb-0\">Belum ada data pesanan di sistem.<\/p>\n            <\/div>\n        <?php else: ?>\n            <div class=\"table-responsive\">\n                <table class=\"table table-hover align-middle mb-0\">\n                    <thead class=\"table-light\">\n                        <tr>\n                            <th class=\"ps-4\">Kode Order<\/th>\n                            <th>Nama Customer<\/th>\n                            <th>Waktu Order<\/th>\n                            <th>Total Tagihan<\/th>\n                            <th>Status<\/th>\n                            <th class=\"text-end pe-4\">Aksi<\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody>\n                        <?php foreach ($recentOrders as $order): ?>\n                            <tr>\n                                <td class=\"ps-4 fw-bold font-monospace text-primary\">\n                                    <?php echo htmlspecialchars($order['order_code']); ?>\n                                <\/td>\n                                <td>\n                                    <div class=\"fw-semibold text-dark\"><?php echo htmlspecialchars($order['customer_name']); ?><\/div>\n                                    <small class=\"text-muted\">@<?php echo htmlspecialchars($order['customer_username']); ?><\/small>\n                                <\/td>\n                                <td class=\"text-muted small\">\n                                    <?php echo date('d/m/Y H:i', strtotime($order['created_at'])); ?> WIB\n                                <\/td>\n                                <td class=\"fw-bold\">\n                                    <?php echo format_rupiah($order['total']); ?>\n                                <\/td>\n                                <td>\n                                    <?php echo render_status_badge($order['status']); ?>\n                                <\/td>\n                                <td class=\"text-end pe-4\">\n                                    <a href=\"<?php echo base_url('admin/order-detail.php?id=' . $order['id']); ?>\" class=\"btn btn-sm btn-dark rounded-pill px-3\">\n                                        <i class=\"bi bi-pencil-square me-1\"><\/i> Kelola\n                                    <\/a>\n                                <\/td>\n                            <\/tr>\n                        <?php endforeach; ?>\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <?php endif; ?>\n    <\/div>\n<\/div>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/admin/menus.php", "type": "text", "size": 22297, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\nrequire_role('admin');\n\n$action = sanitize($_GET['action'] ?? '');\n$uploadDir = __DIR__ . '/../assets/img/';\n\n// Helper function untuk memproses upload gambar\nfunction handle_image_upload($file, $uploadDir) {\n    if (!isset($file) || $file['error'] !== UPLOAD_ERR_OK) {\n        return null; // Tidak ada file yang diunggah\n    }\n\n    $allowedExts = ['jpg', 'jpeg', 'png', 'webp', 'svg'];\n    $allowedMimes = ['image/jpeg', 'image/png', 'image/webp', 'image/svg+xml'];\n\n    $fileName = $file['name'];\n    $fileTmp  = $file['tmp_name'];\n    $fileSize = $file['size'];\n    $ext = strtolower(pathinfo($fileName, PATHINFO_EXTENSION));\n\n    // Validasi ekstensi\n    if (!in_array($ext, $allowedExts, true)) {\n        throw new Exception('Format file gambar tidak diizinkan. Gunakan JPG, PNG, WEBP, atau SVG.');\n    }\n\n    // Validasi ukuran (maksimal 2MB)\n    if ($fileSize > 2 * 1024 * 1024) {\n        throw new Exception('Ukuran file gambar maksimal 2MB.');\n    }\n\n    // Buat nama file unik\n    $newFileName = 'menu_' . time() . '_' . bin2hex(random_bytes(4)) . '.' . $ext;\n    $targetPath = $uploadDir . $newFileName;\n\n    if (!move_uploaded_file($fileTmp, $targetPath)) {\n        throw new Exception('Gagal memindahkan file gambar yang diunggah.');\n    }\n\n    return $newFileName;\n}\n\n// -------------------------------------------------------------\n// PROSES: TAMBAH MENU BARU\n// -------------------------------------------------------------\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action_add'])) {\n    $name        = sanitize($_POST['name'] ?? '');\n    $category    = sanitize($_POST['category'] ?? 'Makanan');\n    $description = sanitize($_POST['description'] ?? '');\n    $price       = (float)($_POST['price'] ?? 0);\n    $status      = sanitize($_POST['status'] ?? 'available');\n\n    if (empty($name) || $price <= 0) {\n        set_flash_message('danger', 'Nama menu dan harga valid wajib diisi.');\n    } else {\n        try {\n            $imageName = 'default-menu.svg';\n            if (isset($_FILES['image']) && $_FILES['image']['error'] === UPLOAD_ERR_OK) {\n                $uploaded = handle_image_upload($_FILES['image'], $uploadDir);\n                if ($uploaded) {\n                    $imageName = $uploaded;\n                }\n            }\n\n            $stmt = $pdo->prepare(\"INSERT INTO menus (name, category, description, price, image, status, created_at) VALUES (?, ?, ?, ?, ?, ?, NOW())\");\n            $stmt->execute([$name, $category, $description, $price, $imageName, $status]);\n\n            set_flash_message('success', \"Menu <strong>{$name}<\/strong> berhasil ditambahkan beserta gambar!\");\n            header(\"Location: \" . base_url('admin/menus.php'));\n            exit;\n        } catch (Exception $e) {\n            set_flash_message('danger', 'Gagal menambahkan menu: ' . $e->getMessage());\n        }\n    }\n}\n\n// -------------------------------------------------------------\n// PROSES: EDIT / UPDATE MENU\n// -------------------------------------------------------------\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['action_edit'])) {\n    $id          = (int)($_POST['id'] ?? 0);\n    $name        = sanitize($_POST['name'] ?? '');\n    $category    = sanitize($_POST['category'] ?? 'Makanan');\n    $description = sanitize($_POST['description'] ?? '');\n    $price       = (float)($_POST['price'] ?? 0);\n    $status      = sanitize($_POST['status'] ?? 'available');\n\n    if ($id <= 0 || empty($name) || $price <= 0) {\n        set_flash_message('danger', 'Data menu tidak valid.');\n    } else {\n        try {\n            // Ambil gambar lama\n            $stmtOld = $pdo->prepare(\"SELECT image FROM menus WHERE id = ?\");\n            $stmtOld->execute([$id]);\n            $oldImage = $stmtOld->fetchColumn();\n\n            $imageName = $oldImage;\n            if (isset($_FILES['image']) && $_FILES['image']['error'] === UPLOAD_ERR_OK) {\n                $uploaded = handle_image_upload($_FILES['image'], $uploadDir);\n                if ($uploaded) {\n                    $imageName = $uploaded;\n                }\n            }\n\n            $stmt = $pdo->prepare(\"UPDATE menus SET name = ?, category = ?, description = ?, price = ?, image = ?, status = ? WHERE id = ?\");\n            $stmt->execute([$name, $category, $description, $price, $imageName, $status, $id]);\n\n            set_flash_message('success', \"Menu <strong>{$name}<\/strong> berhasil diperbarui!\");\n            header(\"Location: \" . base_url('admin/menus.php'));\n            exit;\n        } catch (Exception $e) {\n            set_flash_message('danger', 'Gagal memperbarui menu: ' . $e->getMessage());\n        }\n    }\n}\n\n// -------------------------------------------------------------\n// PROSES: HAPUS MENU\n// -------------------------------------------------------------\nif ($action === 'delete' && isset($_GET['id'])) {\n    $id = (int)$_GET['id'];\n    try {\n        // Cek apakah menu pernah dipesan\n        $stmtCheck = $pdo->prepare(\"SELECT COUNT(*) FROM order_details WHERE menu_id = ?\");\n        $stmtCheck->execute([$id]);\n        $usedCount = (int)$stmtCheck->fetchColumn();\n\n        if ($usedCount > 0) {\n            // Jika pernah dipesan, jangan hapus fisik database demi histori laporan, ubah status menjadi unavailable\n            $stmtOff = $pdo->prepare(\"UPDATE menus SET status = 'unavailable' WHERE id = ?\");\n            $stmtOff->execute([$id]);\n            set_flash_message('warning', \"Menu tidak dapat dihapus permanen karena terdapat dalam riwayat transaksi. Status menu telah diubah menjadi <strong>Tidak Tersedia (Unavailable)<\/strong>.\");\n        } else {\n            $stmtDel = $pdo->prepare(\"DELETE FROM menus WHERE id = ?\");\n            $stmtDel->execute([$id]);\n            set_flash_message('success', \"Menu berhasil dihapus dari sistem.\");\n        }\n    } catch (PDOException $e) {\n        set_flash_message('danger', 'Gagal menghapus menu: ' . $e->getMessage());\n    }\n    header(\"Location: \" . base_url('admin/menus.php'));\n    exit;\n}\n\n// Ambil seluruh daftar menu\n$search = sanitize($_GET['search'] ?? '');\n$filterCat = sanitize($_GET['category'] ?? '');\n\n$sql = \"SELECT * FROM menus WHERE 1=1\";\n$params = [];\n\nif (!empty($filterCat) && $filterCat !== 'all') {\n    $sql .= \" AND category = ?\";\n    $params[] = $filterCat;\n}\n\nif (!empty($search)) {\n    $sql .= \" AND (name LIKE ? OR description LIKE ?)\";\n    $params[] = \"%{$search}%\";\n    $params[] = \"%{$search}%\";\n}\n\n$sql .= \" ORDER BY category ASC, id DESC\";\n$stmt = $pdo->prepare($sql);\n$stmt->execute($params);\n$menus = $stmt->fetchAll();\n\n$pageTitle = 'Kelola Menu Cafe';\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4\">\n    <div>\n        <h2 class=\"fw-bold mb-1\"><i class=\"bi bi-grid-fill text-warning me-2\"><\/i>Kelola Daftar Menu Cafe<\/h2>\n        <p class=\"text-muted small mb-0\">Tambah, ubah foto/deskripsi/harga, dan atur ketersediaan menu cafe<\/p>\n    <\/div>\n    <div>\n        <button type=\"button\" class=\"btn btn-warning rounded-pill px-4 py-2 fw-bold shadow-sm\" data-bs-toggle=\"modal\" data-bs-target=\"#modalAddMenu\">\n            <i class=\"bi bi-plus-circle-fill me-1\"><\/i> Tambah Menu Baru\n        <\/button>\n    <\/div>\n<\/div>\n\n<!-- Filter Box -->\n<div class=\"card border-0 shadow-sm p-3 mb-4 bg-white\">\n    <form action=\"<?php echo base_url('admin/menus.php'); ?>\" method=\"GET\" class=\"row g-2 align-items-center\">\n        <div class=\"col-lg-7 d-flex flex-wrap gap-2\">\n            <a href=\"<?php echo base_url('admin/menus.php'); ?>\" class=\"btn btn-sm rounded-pill px-3 <?php echo (empty($filterCat) || $filterCat === 'all') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n                Semua Kategori\n            <\/a>\n            <a href=\"<?php echo base_url('admin/menus.php?category=Makanan'); ?>\" class=\"btn btn-sm rounded-pill px-3 <?php echo ($filterCat === 'Makanan') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n                Makanan\n            <\/a>\n            <a href=\"<?php echo base_url('admin/menus.php?category=Minuman'); ?>\" class=\"btn btn-sm rounded-pill px-3 <?php echo ($filterCat === 'Minuman') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n                Minuman\n            <\/a>\n            <a href=\"<?php echo base_url('admin/menus.php?category=Snack'); ?>\" class=\"btn btn-sm rounded-pill px-3 <?php echo ($filterCat === 'Snack') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n                Snack\n            <\/a>\n        <\/div>\n        <div class=\"col-lg-5\">\n            <div class=\"input-group\">\n                <input type=\"text\" name=\"search\" class=\"form-control form-control-sm\" placeholder=\"Cari nama menu...\" value=\"<?php echo htmlspecialchars($search); ?>\">\n                <button class=\"btn btn-sm btn-dark px-3\" type=\"submit\"><i class=\"bi bi-search\"><\/i><\/button>\n            <\/div>\n        <\/div>\n    <\/form>\n<\/div>\n\n<!-- Tabel Daftar Menu -->\n<div class=\"card border-0 shadow-sm\">\n    <div class=\"card-body p-0\">\n        <?php if (empty($menus)): ?>\n            <div class=\"text-center py-5\">\n                <i class=\"bi bi-inbox fs-1 text-muted\"><\/i>\n                <h5 class=\"fw-bold mt-3 mb-1\">Belum Ada Menu<\/h5>\n                <p class=\"text-muted small\">Klik tombol \"Tambah Menu Baru\" untuk menambahkan menu pertama Anda.<\/p>\n            <\/div>\n        <?php else: ?>\n            <div class=\"table-responsive\">\n                <table class=\"table table-hover align-middle mb-0\">\n                    <thead class=\"table-light\">\n                        <tr>\n                            <th class=\"ps-4\" style=\"width: 80px;\">Foto<\/th>\n                            <th>Nama Menu<\/th>\n                            <th>Kategori<\/th>\n                            <th>Harga<\/th>\n                            <th>Status<\/th>\n                            <th class=\"text-end pe-4\">Aksi<\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody>\n                        <?php foreach ($menus as $m): ?>\n                            <tr>\n                                <td class=\"ps-4\">\n                                    <img src=\"<?php echo get_menu_image_url($m['image']); ?>\" alt=\"\" width=\"56\" height=\"56\" class=\"rounded object-fit-cover bg-light p-1 border\">\n                                <\/td>\n                                <td>\n                                    <div class=\"fw-bold text-dark\"><?php echo htmlspecialchars($m['name']); ?><\/div> mibold\">Deskripsi Menu<\/label>\n                                                    <textarea name=\"description\" class=\"form-control\" rows=\"2\"><?php echo htmlspecialchars($m['description']); ?><\/textarea>\n                                                <\/div>\n                                                <div class=\"mb-3\">\n                                                    <label class=\"form-label fw-semibold\">Status Ketersediaan<\/label>\n                                                    <select name=\"status\" class=\"form-select\">\n                                                        <option value=\"available\" <?php echo ($m['status'] === 'available') ? 'selected' : ''; ?>>Tersedia (Aktif di Menu)<\/option>\n                                                        <option value=\"unavailable\" <?php echo ($m['status'] === 'unavailable') ? 'selected' : ''; ?>>Habis / Tidak Tersedia<\/option>\n                                                    <\/select>\n                                                <\/div>\n                                                <div class=\"mb-3\">\n                                                    <label class=\"form-label fw-semibold\">Ganti Gambar Menu (Opsional)<\/label>\n                                                    <input type=\"file\" name=\"image\" class=\"form-control\" accept=\"image/*\">\n                                                    <small class=\"text-muted d-block mt-1\">Format: JPG, PNG, WEBP, SVG (Maks. 2MB). Biarkan kosong jika tidak ingin mengganti gambar.<\/small>\n                                                <\/div>\n                                            <\/div>\n                                            <div class=\"modal-footer bg-light\">\n                                                <button type=\"button\" class=\"btn btn-outline-secondary rounded-pill px-3\" data-bs-dismiss=\"modal\">Batal<\/button>\n                                                <button type=\"submit\" class=\"btn btn-warning rounded-pill px-4 fw-bold\">Simpan Perubahan<\/button>\n                                            <\/div>\n                                        <\/form>\n                                    <\/div>\n                                <\/div>\n                            <\/div>\n                        <?php endforeach; ?>\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <?php endif; ?>\n    <\/div>\n<\/div>\n\n<!-- MODAL TAMBAH MENU BARU -->\n<div class=\"modal fade\" id=\"modalAddMenu\" tabindex=\"-1\" aria-hidden=\"true\">\n    <div class=\"modal-dialog modal-dialog-centered\">\n        <div class=\"modal-content border-0 shadow\">\n            <div class=\"modal-header bg-dark text-white\">\n                <h5 class=\"modal-title fw-bold\"><i class=\"bi bi-plus-circle-fill me-2 text-warning\"><\/i>Tambah Menu Baru<\/h5>\n                <button type=\"button\" class=\"btn-close btn-close-white\" data-bs-dismiss=\"modal\" aria-label=\"Close\"><\/button>\n            <\/div>\n            <form action=\"<?php echo base_url('admin/menus.php'); ?>\" method=\"POST\" enctype=\"multipart/form-data\">\n                <input type=\"hidden\" name=\"action_add\" value=\"1\">\n\n                <div class=\"modal-body p-4\">\n                    <div class=\"mb-3\">\n                        <label class=\"form-label fw-semibold\">Nama Menu<\/label>\n                        <input type=\"text\" name=\"name\" class=\"form-control\" placeholder=\"Contoh: Spaghetti Bolognese\" required>\n                    <\/div>\n                    <div class=\"row g-3 mb-3\">\n                        <div class=\"col-md-6\">\n                            <label class=\"form-label fw-semibold\">Kategori<\/label>\n                            <select name=\"category\" class=\"form-select\" required>\n                                <option value=\"Makanan\" selected>Makanan<\/option>\n                                <option value=\"Minuman\">Minuman<\/option>\n                                <option value=\"Snack\">Snack / Camilan<\/option>\n                            <\/select>\n                        <\/div>\n                        <div class=\"col-md-6\">\n                            <label class=\"form-label fw-semibold\">Harga (Rp)<\/label>\n                            <input type=\"number\" name=\"price\" class=\"form-control\" placeholder=\"25000\" min=\"500\" step=\"500\" required>\n                        <\/div>\n                    <\/div>\n                    <div class=\"mb-3\">\n                        <label class=\"form-label fw-semibold\">Deskripsi Menu<\/label>\n                        <textarea name=\"description\" class=\"form-control\" rows=\"2\" placeholder=\"Jelaskan bahan utama dan kelezatan menu...\"><\/textarea>\n                    <\/div>\n                    <div class=\"mb-3\">\n                        <label class=\"form-label fw-semibold\">Status Ketersediaan<\/label>\n                        <select name=\"status\" class=\"form-select\">\n                            <option value=\"available\" selected>Tersedia (Aktif di Menu)<\/option>\n                            <option value=\"unavailable\">Habis / Tidak Tersedia<\/option>\n                        <\/select>\n                    <\/div>\n                    <div class=\"mb-3\">\n                        <label class=\"form-label fw-semibold\">Upload Gambar Menu<\/label>\n                        <input type=\"file\" name=\"image\" class=\"form-control\" accept=\"image/*\">\n                        <small class=\"text-muted d-block mt-1\">Format: JPG, PNG, WEBP, SVG (Maks. 2MB). Jika dikosongkan, gambar default akan digunakan.<\/small>\n                    <\/div>\n                <\/div>\n                <div class=\"modal-footer bg-light\">\n                    <button type=\"button\" class=\"btn btn-outline-secondary rounded-pill px-3\" data-bs-dismiss=\"modal\">Batal<\/button>\n                    <button type=\"submit\" class=\"btn btn-warning rounded-pill px-4 fw-bold\">Tambahkan Menu<\/button>\n                <\/div>\n            <\/form>\n        <\/div>\n    <\/div>\n<\/div>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/admin/order-detail.php", "type": "text", "size": 9913, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\nrequire_role('admin');\n\n$orderId = isset($_GET['id']) ? (int)$_GET['id'] : 0;\n\nif ($orderId <= 0) {\n    set_flash_message('danger', 'ID pesanan tidak valid.');\n    header(\"Location: \" . base_url('admin/orders.php'));\n    exit;\n}\n\n// Proses Update Status Order\nif ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['update_status'])) {\n    $newStatus = sanitize($_POST['status'] ?? '');\n    $validStatuses = ['Menunggu', 'Diproses', 'Selesai', 'Dibatalkan'];\n\n    if (in_array($newStatus, $validStatuses, true)) {\n        try {\n            $stmtUpdate = $pdo->prepare(\"UPDATE orders SET status = ? WHERE id = ?\");\n            $stmtUpdate->execute([$newStatus, $orderId]);\n            set_flash_message('success', \"Status pesanan berhasil diperbarui menjadi <strong>{$newStatus}<\/strong>.\");\n        } catch (PDOException $e) {\n            set_flash_message('danger', 'Gagal memperbarui status: ' . $e->getMessage());\n        }\n    } else {\n        set_flash_message('danger', 'Status yang dipilih tidak valid.');\n    }\n    header(\"Location: \" . base_url('admin/order-detail.php?id=' . $orderId));\n    exit;\n}\n\n// Ambil Data Order & Customer\ntry {\n    $stmt = $pdo->prepare(\"SELECT o.*, u.name AS customer_name, u.username AS customer_username \n                           FROM orders o \n                           JOIN users u ON o.user_id = u.id \n                           WHERE o.id = ? LIMIT 1\");\n    $stmt->execute([$orderId]);\n    $order = $stmt->fetch();\n\n    if (!$order) {\n        set_flash_message('danger', 'Data pesanan tidak ditemukan.');\n        header(\"Location: \" . base_url('admin/orders.php'));\n        exit;\n    }\n\n    // Ambil Item Order Details\n    $stmtItems = $pdo->prepare(\"SELECT od.*, m.name AS menu_name, m.category AS menu_category \n                                FROM order_details od \n                                JOIN menus m ON od.menu_id = m.id \n                                WHERE od.order_id = ?\");\n    $stmtItems->execute([$orderId]);\n    $items = $stmtItems->fetchAll();\n\n} catch (PDOException $e) {\n    die(\"Error database: \" . $e->getMessage());\n}\n\n$pageTitle = 'Rincian Pesanan ' . $order['order_code'];\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 no-print\">\n    <div>\n        <div class=\"d-flex align-items-center gap-2 mb-1\">\n            <a href=\"<?php echo base_url('admin/orders.php'); ?>\" class=\"btn btn-sm btn-outline-secondary rounded-pill\">\n                <i class=\"bi bi-arrow-left\"><\/i> Kembali\n            <\/a>\n            <h2 class=\"fw-bold mb-0 font-monospace text-dark\"><?php echo htmlspecialchars($order['order_code']); ?><\/h2>\n        <\/div>\n        <p class=\"text-muted small mb-0\">Rincian lengkap dan status pemrosesan pesanan<\/p>\n    <\/div>\n    <div class=\"d-flex gap-2\">\n        <button onclick=\"window.print()\" class=\"btn btn-outline-dark rounded-pill px-3\">\n            <i class=\"bi bi-printer me-1\"><\/i> Cetak Struk\n        <\/button>\n    <\/div>\n<\/div>\n\n<!-- Tampilan Header Struk Khusus Cetak -->\n<div class=\"print-only text-center mb-4\">\n    <h3 class=\"fw-bold mb-0\">TAKING ORDER CAFE<\/h3>\n    <p class=\"small mb-1\">Jl. Pendidikan No. 45, Kota Pelajar<\/p>\n    <p class=\"small mb-0\">========================================<\/p>\n    <div class=\"d-fl it-font-smoothing: antialiased;\n}\n\n/* Navbar Brand Icon */\n.brand-icon {\n    width: 38px;\n    height: 38px;\n}\n\n/* Hero Section */\n.hero-banner {\n    background-color: #2b1e16;\n    color: #ffffff;\n    border-radius: 20px;\n    overflow: hidden;\n}\n\n/* Card Styling */\n.card {\n    border-radius: 14px;\n    border: none;\n    transition: transform 0.2s ease-out;\n}\n\n.card-menu {\n    border: none;\n    transition: transform 0.2s ease-out;\n}\n\n.card-menu:hover {\n    transform: translateY(-4px);\n}\n\n.menu-img-wrapper {\n    height: 180px;\n    background-color: #f3efe9;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    border-top-left-radius: 14px;\n    border-top-right-radius: 14px;\n    overflow: hidden;\n}\n\n.menu-img-wrapper svg,\n.menu-img-wrapper img {\n    max-height: 140px;\n    object-fit: contain;\n}\n\n/* Stat Cards for Dashboard */\n.stat-card {\n    border-radius: 14px;\n    border: none;\n    transition: transform 0.2s ease-out;\n}\n\n.stat-card:hover {\n    transform: translateY(-3px);\n}\n\n.stat-icon-box {\n    width: 48px;\n    height: 48px;\n    border-radius: 12px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 1.5rem;\n}\n\n/* Order Summary Box */\n.order-summary-card {\n    background-color: #f3f4f6;\n    border-radius: 14px;\n}\n\n/* Receipt / Print Styles */\n@media print {\n    /* Sembunyikan navbar, footer, form filter, dan tombol print saat mencetak */\n    nav, footer, .no-print, .btn, .alert {\n        display: none !important;\n    }\n    \n    body {\n        background-color: #ffffff !important;\n        font-size: 12pt;\n    }\n    \n    .container {\n        max-width: 100% !important;\n        width: 100% !important;\n        padding: 0 !important;\n        margin: 0 !important;\n    }\n    \n    .card {\n        border: none !important;\n    }\n    \n    .print-only {\n        display: block !important;\n    }\n}\n\n.print-only {\n    di xt x=\"100\" y=\"175\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"12\" font-weight=\"bold\" fill=\"#78350f\">Roti Bakar<\/text>\n<\/svg>\n"}, {"path": "share-sistem-ukk/assets/js/script.js", "type": "text", "size": 3807, "content": "/**\n * Taking Order Cafe - Client Side Script\n * Mengutamakan kesederhanaan dan interaktivitas esensial.\n */\n\ndocument.addEventListener('DOMContentLoaded', function () {\n    // 1. Auto dismiss alert messages after 5 seconds\n    const alerts = document.querySelectorAll('.alert-dismissible');\n    alerts.forEach(function (alert) {\n        setTimeout(function () {\n            const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);\n            if (bsAlert) {\n                bsAlert.close();\n            }\n        }, 5000);\n    });\n\n    // 2. Order Form Calculation (Real-time subtotal & total calculation)\n    const orderForm = document.getElementById('orderForm');\n    if (orderForm) {\n        const itemRows = document.querySelectorAll('.order-item-row');\n        const grandTotalDisplay = document.getElementById('grandTotalDisplay');\n        const grandTotalInput = document.getElementById('grandTotalInput');\n        const totalItemsDisplay = document.getElementById('totalItemsDisplay');\n        const submitOrderBtn = document.getElementById('submitOrderBtn');\n\n        function calculateOrder() {\n            let total = 0;\n            let totalQuantity = 0;\n\n            itemRows.forEach(function (row) {\n                const qtyInput = row.querySelector('.item-qty');\n                const price = parseFloat(qtyInput.getAttribute('data-price')) || 0;\n                const qty = parseInt(qtyInput.value) || 0;\n                const subtotal = price * qty;\n                \n                const subtotalDisplay = row.querySelector('.item-subtotal');\n                if (subtotalDisplay) {\n                    subtotalDisplay.textContent = 'Rp ' + subtotal.toLocaleString('id-ID');\n                }\n\n                if (qty > 0) {\n                    total += subtotal;\n                    totalQuantity += qty;\n                    row.classList.add('table-light');\n                } else {\n                    row.classList.remove('table-light');\n                }\n            });\n\n            if (grandTotalDisplay) {\n                grandTotalDisplay.textContent = 'Rp ' + total.toLocaleString('id-ID');\n            }\n            if (grandTotalInput) {\n                grandTotalInput.value = total;\n            }\n            if (totalItemsDisplay) {\n                totalItemsDisplay.textContent = totalQuantity + ' item';\n            }\n            if (submitOrderBtn) {\n                submitOrderBtn.disabled = totalQuantity === 0;\n            }\n        }\n\n        // Event listener untuk tombol plus minus dan input manual\n        itemRows.forEach(function (row) {\n            const qtyInput = row.querySelector('.item-qty');\n            const btnPlus = row.querySelector('.btn-plus');\n            const btnMinus = row.querySelector('.btn-minus');\n\n            if (btnPlus && qtyInput) {\n                btnPlus.addEventListener('click', function () {\n                    qtyInput.value = (parseInt(qtyInput.value) || 0) + 1;\n                    calculateOrder();\n                });\n            }\n\n            if (btnMinus && qtyInput) {\n                btnMinus.addEventListener('click', function () {\n                    const currentVal = parseInt(qtyInput.value) || 0;\n                    if (currentVal > 0) {\n                        qtyInput.value = currentVal - 1;\n                        calculateOrder();\n                    }\n                });\n            }\n\n            if (qtyInput) {\n                qtyInput.addEventListener('input', function () {\n                    if (parseInt(qtyInput.value) < 0 || isNaN(parseInt(qtyInput.value))) {\n                        qtyInput.value = 0;\n                    }\n                    calculateOrder();\n                });\n            }\n        });\n\n        // Hitung awal saat load halaman\n        calculateOrder();\n    }\n});\n"}, {"path": "share-sistem-ukk/auth/login.php", "type": "text", "size": 5799, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\n// Jika sudah login, langsung alihkan ke dashboard masing-masing\nif (is_logged_in()) {\n    $role = $_SESSION['user']['role'] ?? '';\n    header(\"Location: \" . base_url($role === 'admin' ? 'admin/dashboard.php' : 'customer/dashboard.php'));\n    exit;\n}\n\n$error = '';\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    $username = trim($_POST['username'] ?? '');\n    $password = trim($_POST['password'] ?? '');\n\n    if (empty($username) || empty($password)) {\n        $error = 'Silakan masukkan username dan password.';\n    } else {\n        try {\n            $stmt = $pdo->prepare(\"SELECT * FROM users WHERE username = ? LIMIT 1\");\n            $stmt->execute([$username]);\n            $user = $stmt->fetch();\n\n            if ($user && password_verify($password, $user['password'])) {\n                // Set Data Sesi Pengguna\n                $_SESSION['user'] = [\n                    'id'       => $user['id'],\n                    'name'     => $user['name'],\n                    'username' => $user['username'],\n                    'role'     => $user['role']\n                ];\n\n                set_flash_message('success', \"Selamat datang kembali, <strong>\" . htmlspecialchars($user['name']) . \"<\/strong>!\");\n\n                if ($user['role'] === 'admin') {\n                    header(\"Location: \" . base_url('admin/dashboard.php'));\n                } else {\n                    header(\"Location: \" . base_url('customer/dashboard.php'));\n                }\n                exit;\n            } else {\n                $error = 'Username atau password yang Anda masukkan salah.';\n            }\n        } catch (PDOException $e) {\n            $error = 'Terjadi gangguan sistem database. Silakan coba lagi.';\n        }\n    }\n}\n\n$pageTitle = 'Login Pengguna';\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"row justify-content-center py-4\">\n    <div class=\"col-md-6 col-lg-5\">\n        <div class=\"card border-0 shadow-sm p-4 p-md-5\">\n            <div class=\"text-center mb-4\">\n                <div class=\"brand-icon bg-warning text-dark d-inline-flex align-items-center justify-content-center rounded-circle p-3 shadow-sm mb-3\" style=\"width: 60px; height: 60px;\">\n                    <i class=\"bi bi-person-circle fs-2\"><\/i>\n                <\/div>\n                <h3 class=\"fw-bold mb-1\">Masuk ke Sistem<\/h3>\n                <p class=\"text-muted small\">Aplikasi Taking Order Cafe<\/p>\n            <\/div>\n\n            <?php if (!empty($error)): ?>\n                <div class=\"alert alert-danger alert-dismissible fade show small\" role=\"alert\">\n                    <i class=\"bi bi-exclamation-octagon-fill me-1\"><\/i> <?php echo htmlspecialchars($error); ?>\n                    <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Close\"><\/button>\n                <\/div>\n            <?php endif; ?>\n\n            <form action=\"<?php echo base_url('auth/login.php'); ?>\" method=\"POST\">\n                <div class=\"mb-3\">\n                    <label for=\"username\" class=\"form-label fw-semibold\">Username<\/label>\n                    <div class=\"input-group\">\n                        <span class=\"input-group-text bg-light border-end-0\"><i class=\"bi bi-person\"><\/i><\/span>\n                        <input type=\"text\" name=\"username\" id=\"username\" class=\"form-control border-start-0\" placeholder=\"Masukkan username\" required autofocus value=\"<?php echo isset($_POST['username']) ? htm               <span class=\"badge bg-warning text-dark\">Pelanggan<\/span><br>\n                        User: <code>customer<\/code><br>\n                        Pass: <code>password<\/code>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/auth/logout.php", "type": "text", "size": 669, "content": "<?php\nrequire_once __DIR__ . '/../includes/functions.php';\n\n// Hapus seluruh session\nif (session_status() === PHP_SESSION_NONE) {\n    session_start();\n}\n\n$_SESSION = [];\nif (ini_get(\"session.use_cookies\")) {\n    $params = session_get_cookie_params();\n    setcookie(\n        session_name(),\n        '',\n        time() - 42000,\n        $params[\"path\"],\n        $params[\"domain\"],\n        $params[\"secure\"],\n        $params[\"httponly\"]\n    );\n}\nsession_destroy();\n\n// Mulai sesi baru khusus untuk mengirim flash message logout\nsession_start();\nset_flash_message('info', 'Anda telah berhasil logout dari sistem.');\n\nheader(\"Location: \" . base_url('auth/login.php'));\nexit;\n"}, {"path": "share-sistem-ukk/auth/register.php", "type": "text", "size": 6184, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\n// Jika sudah login, alihkan\nif (is_logged_in()) {\n    header(\"Location: \" . base_url('customer/dashboard.php'));\n    exit;\n}\n\n$error = '';\n\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    $name            = trim($_POST['name'] ?? '');\n    $username        = trim($_POST['username'] ?? '');\n    $password        = trim($_POST['password'] ?? '');\n    $confirmPassword = trim($_POST['confirm_password'] ?? '');\n\n    // Validasi Form\n    if (empty($name) || empty($username) || empty($password) || empty($confirmPassword)) {\n        $error = 'Seluruh kolom pendaftaran wajib diisi.';\n    } elseif (strlen($username) < 3) {\n        $error = 'Username minimal terdiri dari 3 karakter.';\n    } elseif ($password !== $confirmPassword) {\n        $error = 'Konfirmasi password tidak cocok dengan password.';\n    } elseif (strlen($password) < 4) {\n        $error = 'Password minimal terdiri dari 4 karakter demi keamanan.';\n    } else {\n        try {\n            // Cek apakah username sudah dipakai\n            $stmt = $pdo->prepare(\"SELECT id FROM users WHERE username = ? LIMIT 1\");\n            $stmt->execute([$username]);\n            if ($stmt->fetch()) {\n                $error = \"Username '{$username}' sudah digunakan. Silakan pilih username lain.\";\n            } else {\n                // Simpan user baru sebagai customer\n                $hashedPassword = password_hash($password, PASSWORD_DEFAULT);\n                $insertStmt = $pdo->prepare(\"INSERT INTO users (name, username, password, role, created_at) VALUES (?, ?, ?, 'customer', NOW())\");\n                $insertStmt->execute([$name, $username, $hashedPassword]);\n\n                set_flash_message('success', 'Pendaftaran akun berhasil! Silakan login dengan akun baru Anda.');\n                header(\"Location: \" . base_url('auth/login.php'));\n                exit;\n            }\n        } catch (PDOException $e) {\n            $error = 'Terjadi kesalahan sistem saat mendaftarkan akun. Silakan coba lagi.';\n        }\n    }\n}\n\n$pageTitle = 'Registrasi Pelanggan Baru';\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"row justify-content-center py-4\">\n    <div class=\"col-md-6 col-lg-5\">\n        <div class=\"card border-0 shadow-sm p-4 p-md-5\">\n            <div class=\"text-center mb-4\">\n                <div class=\"brand-icon bg-warning text-dark d-inline-flex align-items-center justify-content-center rounded-circle p-3 shadow-sm mb-3\" style=\"width: 60px; height: 60px;\">\n                    <i class=\"bi bi-person-plus-fill fs-2\"><\/i>\n                <\/div>\n                <h3 class=\"fw-bold mb-1\">Daftar Akun Baru<\/h3>\n                <p class=\"text-muted small\">Buat akun untuk memesan menu favorit Anda<\/p>\n            <\/div>\n\n            <?php if (!empty($error)): ?>\n                <div class=\"alert alert-danger alert-dismissible fade show small\" role=\"alert\">\n                    <i class=\"bi bi-exclamation-octagon-fill me-1\"><\/i> <?php echo htmlspecialchars($error); ?>\n                    <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Close\"><\/button>\n                <\/div>\n            <?php endif; ?>\n\n            <form action=\"<?php echo base_url('auth/register.php'); ?>\" method=\"POST\">\n                <div class=\"mb-3\">\n                    <label for=\"name\" class=\"form-label fw-semibold\">Nama Lengkap<\/label>\n                    <div class=\"input-group\">\n                        <span class=\"input-group-text bg-light border-end-0\"><i class=\"bi bi-person-badge\"><\/i><\/span>\n                        <input type=\"text\" name=\"name\" id=\"name\" class=\"form-control border-start-0\" placeholder=\"Contoh: Andi Pratama\" required value=\"<?php echo isset($_POST['name']) ? htmlspecialchars($_POST['name']) : ''; ?>\">\n                    <\/div>\n                <\/div>\n\n                <div class=\"mb-3\">\n                    <label for=\"username\" class=\"form-label fw-semibold\">Username<\/label>\n                    <div class=\"input-group\">\n                        <span class=\"input-group-text bg-light border-end-0\"><i class=\"bi bi-at\"><\/i><\/span>\n                        <input type=\"text\" name=\"username\" id=\"username\" class=\"form-control border-start-0\" placeholder=\"Username tanpa spasi\" required value=\"<?php echo isset($_POST['username']) ? htmlspecialchars($_POST['username']) : ''; ?>\">\n                    <\/div>\n                <\/div>\n\n $host     = 'localhost';\n$dbname   = 'taking_order_cafe';\n$username = 'root';\n$password = ''; // Default XAMPP adalah string kosong\n\ntry {\n    $dsn = \"mysql:host={$host};dbname={$dbname};charset=utf8mb4\";\n    $options = [\n        PDO::ATTR_ERRMODE            => PDO::ERRMODE_EXCEPTION,\n        PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,\n        PDO::ATTR_EMULATE_PREPARES   => false,\n    ];\n    \n    $pdo = new PDO($dsn, $username, $password, $options);\n} catch (PDOException $e) {\n    // Jika koneksi gagal, hentikan proses dan tampilkan pesan yang mudah dipahami\n    die(\"<h3>Koneksi Database Gagal:<\/h3> \" . htmlspecialchars($e->getMessage()) . \"<br><small>Pastikan MySQL di XAMPP sudah berjalan dan database `taking_order_cafe` sudah diimpor.<\/small>\");\n}\n"}, {"path": "share-sistem-ukk/customer/dashboard.php", "type": "text", "size": 6591, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\n// Lindungi akses hanya untuk role customer\nrequire_role('customer');\n\n$user = current_user();\n$userId = $user['id'];\n\n// Ambil statistik ringkas customer\ntry {\n    // Total Order\n    $stmt = $pdo->prepare(\"SELECT COUNT(*) FROM orders WHERE user_id = ?\");\n    $stmt->execute([$userId]);\n    $totalOrders = (int)$stmt->fetchColumn();\n\n    // Order Aktif (Menunggu atau Diproses)\n    $stmt = $pdo->prepare(\"SELECT COUNT(*) FROM orders WHERE user_id = ? AND status IN ('Menunggu', 'Diproses')\");\n    $stmt->execute([$userId]);\n    $activeOrders = (int)$stmt->fetchColumn();\n\n    // 5 Order Terakhir\n    $stmt = $pdo->prepare(\"SELECT * FROM orders WHERE user_id = ? ORDER BY id DESC LIMIT 5\");\n    $stmt->execute([$userId]);\n    $recentOrders = $stmt->fetchAll();\n} catch (PDOException $e) {\n    $totalOrders = 0;\n    $activeOrders = 0;\n    $recentOrders = [];\n}\n\n$pageTitle = 'Dashboard Pelanggan';\nrequire_once __
