d shadow-sm border-0 p-3 bg-white\">\n            <div class=\"d-flex align-items-center gap-3\">\n                <div class=\"stat-icon-box bg-warning bg-opacity-25 text-dark\">\n                    <i class=\"bi bi-hourglass-split\"><\/i>\n                <\/div>\n                <div>\n                    <h6 class=\"text-muted small mb-0\">Pesanan Sedang Berlangsung<\/h6>\n                    <h3 class=\"fw-bold mb-0\"><?php echo $activeOrders; ?> <span class=\"fs-6 fw-normal text-muted\">pesanan aktif<\/span><\/h3>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/div>\n\n<!-- Pesanan Terakhir Card -->\n<div class=\"card border-0 shadow-sm\">\n    <div class=\"card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center\">\n        <h5 class=\"fw-bold mb-0\"><i class=\"bi bi-clock-history me-2 text-warning\"><\/i>Pesanan Terakhir Anda<\/h5>\n        <a href=\"<?php echo base_url('customer/orders.php'); ?>\" class=\"btn btn-sm btn-outline-secondary rounded-pill px-3\">\n            Lihat Semua Pesanan <i class=\"bi bi-arrow-right ms-1\"><\/i>\n        <\/a>\n    <\/div>\n    <div class=\"card-body p-0\">\n        <?php if (empty($recentOrders)): ?>\n            <div class=\"text-center py-5\">\n                <i class=\"bi bi-bag-x fs-1 text-muted\"><\/i>\n                <p class=\"text-muted mt-2 mb-3\">Anda belum pernah melakukan pemesanan.<\/p>\n                <a href=\"<?php echo base_url('customer/order.php'); ?>\" class=\"btn btn-warning rounded-pill px-4\">\n                    Mulai Pesan Menu Pertama\n                <\/a>\n            <\/div>\n        <?php else: ?>\n            <div class=\"table-responsive\">\n                <table class=\"table table-hover align-middle mb-0\">\n                    <thead class=\"table-light\">\n                        <tr>\n                            <th class=\"ps-4\">Kode Order<\/th>\n                            <th>Tanggal & Waktu<\/th>\n                            <th>Total Pembayaran<\/th>\n                            <th>Status Pesanan<\/th>\n                            <th class=\"text-end pe-4\">Aksi<\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody>\n                        <?php foreach ($recentOrders as $ord): ?>\n                            <tr>\n                                <td class=\"ps-4 fw-bold font-monospace text-primary\">\n                                    <?php echo htmlspecialchars($ord['order_code']); ?>\n                                <\/td>\n                                <td class=\"text-muted small\">\n                                    <?php echo date('d/m/Y H:i', strtotime($ord['created_at'])); ?> WIB\n                                <\/td>\n                                <td class=\"fw-bold\">\n                                    <?php echo format_rupiah($ord['total']); ?>\n                                <\/td>\n                                <td>\n                                    <?php echo render_status_badge($ord['status']); ?>\n                                <\/td>\n                                <td class=\"text-end pe-4\">\n                                    <a href=\"<?php echo base_url('customer/orders.php#order-' . $ord['id']); ?>\" class=\"btn btn-sm btn-outline-dark rounded-pill px-3\">\n                                        <i class=\"bi bi-eye me-1\"><\/i> Rincian\n                                    <\/a>\n                                <\/td>\n                            <\/tr>\n                        <?php endforeach; ?>\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <?php endif; ?>\n    <\/div>\n<\/div>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/customer/menu.php", "type": "text", "size": 6715, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\nrequire_role('customer');\n\n// Filter kategori & pencarian\n$category = sanitize($_GET['category'] ?? '');\n$search   = sanitize($_GET['search'] ?? '');\n\n$sql = \"SELECT * FROM menus WHERE status = 'available'\";\n$params = [];\n\nif (!empty($category) && $category !== 'all') {\n    $sql .= \" AND category = ?\";\n    $params[] = $category;\n}\n\nif (!empty($search)) {\n    $sql .= \" AND (name LIKE ? OR description LIKE ?)\";\n    $params[] = \"%{$search}%\";\n    $params[] = \"%{$search}%\";\n}\n\n$sql .= \" ORDER BY category ASC, name ASC\";\n\ntry {\n    $stmt = $pdo->prepare($sql);\n    $stmt->execute($params);\n    $menus = $stmt->fetchAll();\n} catch (PDOException $e) {\n    $menus = [];\n}\n\n$pageTitle = 'Katalog Menu Cafe';\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4\">\n    <div>\n        <h2 class=\"fw-bold mb-1\"><i class=\"bi bi-grid-fill me-2 text-warning\"><\/i>Katalog Menu Cafe<\/h2>\n        <p class=\"text-muted small mb-0\">Silakan pilih makanan dan minuman favorit Anda<\/p>\n    <\/div>\n    <div>\n        <a href=\"<?php echo base_url('customer/order.php'); ?>\" class=\"btn btn-warning rounded-pill px-4 py-2 fw-bold shadow-sm\">\n            <i class=\"bi bi-bag-check-fill me-1\"><\/i> Mulai Formulir Order\n        <\/a>\n    <\/div>\n<\/div>\n\n<!-- Filter & Search Bar -->\n<div class=\"card border-0 shadow-sm p-3 mb-4 bg-white\">\n    <form action=\"<?php echo base_url('customer/menu.php'); ?>\" method=\"GET\" class=\"row g-2 align-items-center\">\n        <!-- Kategori Nav Pills -->\n        <div class=\"col-lg-7 d-flex flex-wrap gap-2\">\n            <a href=\"<?php echo base_url('customer/menu.php' . (!empty($search) ? '?search=' . urlencode($search) : '')); ?>\" \n               class=\"btn btn-sm rounded-pill px-3 <?php echo (empty($category) || $category === 'all') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n               Semua Kategori\n            <\/a>\n            <a href=\"<?php echo base_url('customer/menu.php?category=Makanan' . (!empty($search) ? '&search=' . urlencode($search) : '')); ?>\" \n               class=\"btn btn-sm rounded-pill px-3 <?php echo ($category === 'Makanan') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n               <i class=\"bi bi-egg-fried me-1\"><\/i> Makanan\n            <\/a>\n            <a href=\"<?php echo base_url('customer/menu.php?category=Minuman' . (!empty($search) ? '&search=' . urlencode($search) : '')); ?>\" \n               class=\"btn btn-sm rounded-pill px-3 <?php echo ($category === 'Minuman') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n               <i class=\"bi bi-cup-straw me-1\"><\/i> Minuman\n            <\/a>\n            <a href=\"<?php echo base_url('customer/menu.php?category=Snack' . (!empty($search) ? '&search=' . urlencode($search) : '')); ?>\" \n               class=\"btn btn-sm rounded-pill px-3 <?php echo ($category === 'Snack') ? 'btn-dark' : 'btn-outline-secondary'; ?>\">\n               <i class=\"bi bi-cookie me-1\"><\/i> Snack / Camilan\n            <\/a>\n        <\/div>\n\n        <!-- Search Input -->\n        <div class=\"col-lg-5\">\n            <div class=\"input-group\">\n                <?php if (!empty($category)): ?>\n                    <input type=\"hidden\" name=\"category\" value=\"<?php echo htmlspecialchars($category); ?>\">\n                <?php endif; ?>\n                <input type=\"text\" name=\"search\" class=\"form-control form-control-sm\" placeholder=\"Cari nama menu...\" value=\"<?php echo htmlspecialchars($search); ?>\">\n                <button class=\"btn btn-sm btn-warning fw-semibold px-3\" type=\"submit\">\n                    <i class=\"bi bi-search me-1\"><\/i> Cari\n                <\/button>\n                <?php if (!empty($search) || (!empty($category) && $category !== 'all')): ?>\n                    <a href=\"<?php echo base_url('customer/menu.php'); ?>\" class=\"btn btn-sm btn-outline-secondary\" title=\"Reset Filter\">\n                        <i class=\"bi bi-x-lg\"><\/i>\n                    <\/a>\n                <?php endif; ?>\n            <\/div>\n        <\/div>\n    <\/form>\n<\/div>\n\n<!-- Daftar Menu Cards -->\n<div class=\"row g-4\">\n    <?php if (empty($menus)): ?>\n        <div class=\"col-12\">\n            <div class=\"card border-0 shadow-sm text-center py-5\">\n                <i class=\"bi bi-search fs-1 text-muted\"><\/i>\n                <h5 class=\"fw-bold mt-3 mb-1\">Menu Tidak Ditemukan<\/h5>\n                <p class=\"text-muted small\">Coba ubah kata kunci pencarian atau filter kategori Anda.<\/p>\n                <div>\n                    <a href=\"<?php echo base_url('customer/menu.php'); ?>\" class=\"btn btn-sm btn-outline-dark rounded-pill px-4\">\n                        Tampilkan Semua Menu\n                    <\/a>\n                <\/div>\n            <\/div>\n        <\/div>\n    <?php else: ?>\n        <?php foreach ($menus as $menu): ?>\n            <div class=\"col-md-6 col-lg-3\">\n                <div class=\"card h-100 border-0 shadow-sm card-menu\">\n                    <div class=\"menu-img-wrapper position-relative\">\n                        <img src=\"<?php echo get_menu_image_url($menu['image']); ?>\" alt=\"<?php echo htmlspecialchars($menu['name']); ?>\">\n                        <span class=\"badge bg-dark bg-opacity-75 position-absolute top-0 start-0 m-2 rounded-pill small\">\n                            <?php echo htmlspecialchars($menu['category']); ?>\n                        <\/span>\n                    <\/div>\n                    <div class=\"card-body d-flex flex-column p-3\">\n                        <h6 class=\"fw-bold mb-1 text-dark\"><?php echo htmlspecialchars($menu['name']); ?><\/h6>\n                        <p class=\"text-muted small flex-grow-1 mb-2 lh-sm\" style=\"min-height: 38px;\">\n                            <?php echo htmlspecialchars($menu['description']); ?>\n                        <\/p>\n                        <div class=\"d-flex justify-content-between align-items-center pt-2 border-top\">\n                            <div>\n                                <span class=\"fw-bold text-success fs-6\"><?php echo format_rupiah($menu['price']); ?><\/span>\n                            <\/div>\n                            <a href=\"<?php echo base_url('customer/order.php?select=' . $menu['id']); ?>\" class=\"btn btn-sm btn-warning rounded-pill px-3 fw-semibold\">\n                                <i class=\"bi bi-plus-lg me-1\"><\/i> Pesan\n                            <\/a>\n                        <\/div>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <?php endforeach; ?>\n    <?php endif; ?>\n<\/div>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/customer/order.php", "type": "text", "size": 11206, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\nrequire_role('customer');\n\n$user = current_user();\n$userId = $user['id'];\n$selectedMenuId = isset($_GET['select']) ? (int)$_GET['select'] : 0;\n$error = '';\n\n// Ambil semua menu yang aktif\ntry {\n    $stmt = $pdo->prepare(\"SELECT * FROM menus WHERE status = 'available' ORDER BY category ASC, name ASC\");\n    $stmt->execute();\n    $availableMenus = $stmt->fetchAll();\n} catch (PDOException $e) {\n    $availableMenus = [];\n    $error = 'Gagal memuat daftar menu dari database.';\n}\n\n// Proses pembuatan pesanan saat form disubmit\nif ($_SERVER['REQUEST_METHOD'] === 'POST') {\n    $quantities = $_POST['quantity'] ?? [];\n    $orderItems = [];\n    $grandTotal = 0;\n\n    // Hitung item yang dipilih\n    foreach ($availableMenus as $m) {\n        $mId = $m['id'];\n        $qty = isset($quantities[$mId]) ? (int)$quantities[$mId] : 0;\n        \n        if ($qty > 0) {\n            $subtotal = $m['price'] * $qty;\n            $grandTotal += $subtotal;\n            $orderItems[] = [\n                'menu_id'  => $mId,\n                'name'     => $m['name'],\n                'price'    => $m['price'],\n                'quantity' => $qty,\n                'subtotal' => $subtotal\n            ];\n        }\n    }\n\n    if (empty($orderItems)) {\n        $error = 'Silakan tentukan jumlah pesanan minimal 1 porsi menu sebelum mengirim order.';\n    } else {\n        try {\n            // Memulai Transaksi Database (Atomic Operation)\n            $pdo->beginTransaction();\n\n            // 1. Generate Kode Order Unik\n            $orderCode = generate_order_code($pdo);\n\n            // 2. Simpan ke tabel orders\n            $stmtOrder = $pdo->prepare(\"INSERT INTO orders (order_code, user_id, total, status, created_at) VALUES (?, ?, ?, 'Menunggu', NOW())\");\n            $stmtOrder->execute([$orderCode, $userId, $grandTotal]);\n            $orderId = $pdo->lastInsertId();\n\n            // 3. Simpan rincian ke tabel order_details\n            $stmtDetail = $pdo->prepare(\"INSERT INTO order_details (order_id, menu_id, price, quantity, subtotal) VALUES (?, ?, ?, ?, ?)\");\n            foreach ($orderItems as $item) {\n                $stmtDetail->execute([\n                    $orderId,\n                    $item['menu_id'],\n                    $item['price'],\n                    $item['quantity'],\n                    $item['subtotal']\n                ]);\n            }\n\n            // Commit Transaksi jika semua berhasil\n            $pdo->commit();\n\n            set_flash_message('success', \"Pesanan Anda <strong>{$orderCode}<\/strong> berhasil dibuat! Mohon tunggu konfirmasi barista/admin.\");\n            header(\"Location: \" . base_url('customer/orders.php'));\n            exit;\n\n        } catch (Exception $e) {\n            $pdo->rollBack();\n            $error = 'Terjadi kesalahan saat memproses pesanan: ' . $e->getMessage();\n        }\n    }\n}\n\n// Hitung nilai awal jika ada menu yang dipilih via URL query parameter\n$initialTotal = 0;\n$initialItemsCount = 0;\nif ($selectedMenuId > 0) {\n    foreach ($availableMenus as $menu) {\n        if ((int)$menu['id'] === $selectedMenuId) {\n            $initialTotal = (float)$menu['price'];\n            $initialItemsCount = 1;\n            break;\n        }\n    }\n}\n\n$pageTitle = 'Formulir Pemesanan (Taking Order)';\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"d-flex justify-content-between align-items-center mb-4\">\n    <div>\n        <h2 class=\"fw-bold mb-1\"><i class=\"bi bi-bag-plus-fill me-2 text-warning\"><\/i>Formulir Pemesanan Cafe<\/h2>\n        <p class=\"text-muted small mb-0\">Tentukan jumlah porsi menu yang ingin Anda pesan di bawah ini<\/p>\n    <\/div>\n    <a href=\"<?php echo base_url('customer/menu.php'); ?>\" class=\"btn btn-outline-dark rounded-pill px-3\">\n        <i class=\"bi bi-arrow-left me-1\"><\/i> Kembali ke Menu\n    <\/a>\n<\/div>\n\n<?php if (!empty($error)): ?>\n    <div class=\"alert alert-danger alert-dismissible fade show\" role=\"alert\">\n        <i class=\"bi bi-exclamation-triangle-fill me-2\"><\/i> <?php echo htmlspecialchars($error); ?>\n        <button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Close\"><\/button>\n    <\/div>\n<?php endif; ?>\n\n<form action=\"<?php echo base_url('customer/order.php'); ?>\" method=\"POST\" id=\"orderForm\">\n    <div class=\"row g-4\">\n        <!-- Kolom Kiri: Tabel Pilihan Menu -->\n        <div class=\"col-lg-8\">\n            <div class=\"card border-0 shadow-sm\">\n                <div class=\"card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center\">\n                    <h5 class=\"fw-bold mb-0\">Daftar Menu Tersedia<\/h5>\n                    <span class=\"badge bg-light text-secondary border\"><?php echo count($availableMenus); ?> Menu<\/span>\n                <\/div>\n                <div class=\"card-body p-0\">\n                    <div class=\"table-responsive\">\n                        <table class=\"table table-hover align-middle mb-0\">\n                            <thead class=\"table-light\">\n                                <tr>\n                                    <th style=\"width: 70px;\">Foto<\/th>\n                                    <th>Nama Menu & Kategori<\/th>\n                                    <th style=\"width: 130px;\">Harga<\/th>\n                                    <th style=\"width: 170px;\" class=\"text-center\">Jumlah (Qty)<\/th>\n                                    <th style=\"width: 140px;\" class=\"text-end pe-3\">Subtotal<\/th>\n                                <\/tr>\n                            <\/thead>\n                            <tbody>\n                                <?php if (empty($availableMenus)): ?>\n                                    <tr>\n                                        <td colspan=\"5\" class=\"text-center py-4 text-muted\">Tidak ada menu yang tersedia.<\/td>\n                                    <\/tr>\n                                <?php else: ?>\n                                    <?php foreach ($availableMenus as $menu): ?>\n                                        <?php \n                                        $initialQty = ($selectedMenuId === (int)$menu['id']) ? 1 : 0; \n                                        ?>\n                                        <tr class=\"order-item-row <?php echo ($initialQty > 0) ? 'table-light' : ''; ?>\">\n                                            <td>\n                                                <img src=\"<?php echo get_menu_image_url($menu['image']); ?>\" alt=\"\" width=\"50\" height=\"50\" class=\"rounded object-fit-cover bg-light p-1\">\n                                            <\/td>\n                                            <td>\n                                                <div class=\"fw-bold text-dark\"><?php echo htmlspecialchars($menu['name']); ?><\/div>\n                                                <span class=\"badge bg-light text-dark border small\"><?php echo htmlspecialchars($menu['category']); ?><\/span>\n                                            <\/td>\n                                            <td>\n                                                <span class=\"fw-semibold\"><?php echo format_rupiah($menu['price']); ?><\/span>\n                                            <\/td>\n                                            <td>\n                                                <div class=\"input-group input-group-sm justify-content-center\">\n                                                    <button class=\"btn btn-outline-secondary btn-minus\" type=\"button\"><i class=\"bi bi-dash\"><\/i><\/button>\n                                                    <input type=\"number\" \n                                                           name=\"quantity[<?php echo $menu['id']; ?>]\" \n                                                           class=\"form-control text-center item-qty\" \n                                                           style=\"max-width: 55px;\" \n                                                           value=\"<?php echo $initialQty; ?>\" \n                                                           min=\"0\" \n                                                           max=\"99\"\n                                                           data-price=\"<?php echo $menu['price']; ?>\">\n                                                    <button class=\"btn btn-outline-secondary btn-plus\" type=\"button\"><i class=\"bi bi-plus\"><\/i><\/button>\n                                                <\/div>\n                                            <\/td>\n                                            <td class=\"text-end pe-3 fw-bold item-subtotal\">\n                                                <?php echo format_rupiah($menu['price'] * $initialQty); ?>\n                                            <\/td>\n                                        <\/tr>\n                                    <?php endforeach; ?>\n                                <?php endif; ?>\n                            <\/tbody>\n                        <\/table>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Kolom Kanan: Ringkasan Pemesanan -->\n        <div class=\"col-lg-4\">\n            <div class=\"card border-0 shadow-sm sticky-top\" style=\"top: 80px;\">\n                <div class=\"card-header bg-dark text-white py-3\">\n                    <h5 class=\"fw-bold mb-0\"><i class=\"bi bi-receipt me-2 text-warning\"><\/i>Ringkasan Pesanan<\/h5>\n                <\/div>\n                <div class=\"card-body p-4\">\n                    <div class=\"mb-3 pb-3 border-bottom\">\n                        <small class=\"text-muted d-block\">Nama Pelanggan:<\/small>\n                        <strong class=\"fs-6\"><?php echo htmlspecialchars($user['name']); ?><\/strong>\n                    <\/div>\n\n                    <div class=\"d-flex justify-content-between mb-2\">\n                        <span class=\"text-muted\">Total Jumlah Item:<\/span>\n                        <strong id=\"totalItemsDisplay\"><?php echo $initialItemsCount; ?> item<\/strong>\n                    <\/div>\n\n                    <div class=\"d-flex justify-content-between align-items-center my-3 py-3 border-top border-bottom\">\n                        <span class=\"fs-5 fw-bold\">Total Tagihan:<\/span>\n                        <span class=\"fs-4 fw-extrabold text-success\" id=\"grandTotalDisplay\"><?php echo format_rupiah($initialTotal); ?><\/span>\n                        <input type=\"hidden\" id=\"grandTotalInput\" value=\"<?php echo $initialTotal; ?>\">\n                    <\/div>\n\n                    <div class=\"alert alert-light border small text-muted mb-4\">\n                        <i class=\"bi bi-info-circle me-1\"><\/i> Pesanan Anda akan langsung tercatat di sistem dapur/barista cafe.\n                    <\/div>\n\n                    <button type=\"submit\" class=\"btn btn-warning w-100 py-3 rounded-pill fw-bold shadow-sm\" id=\"submitOrderBtn\" <?php echo ($initialItemsCount === 0) ? 'disabled' : ''; ?>>\n                        <i class=\"bi bi-check2-circle me-1\"><\/i> Konfirmasi & Pesan Sekarang\n                    <\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/form>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/customer/orders.php", "type": "text", "size": 7176, "content": "<?php\nrequire_once __DIR__ . '/../config/database.php';\nrequire_once __DIR__ . '/../includes/functions.php';\nrequire_once __DIR__ . '/../includes/auth.php';\n\nrequire_role('customer');\n\n$user = current_user();\n$userId = $user['id'];\n\n// Ambil semua riwayat pesanan milik customer bersangkutan\ntry {\n    $stmt = $pdo->prepare(\"SELECT * FROM orders WHERE user_id = ? ORDER BY id DESC\");\n    $stmt->execute([$userId]);\n    $orders = $stmt->fetchAll();\n\n    // Ambil semua rincian item untuk pesanan-pesanan tersebut\n    $orderDetailsMap = [];\n    if (!empty($orders)) {\n        $orderIds = array_column($orders, 'id');\n        $placeholders = str_repeat('?,', count($orderIds) - 1) . '?';\n        \n        $sqlDetails = \"SELECT od.*, m.name AS menu_name, m.category AS menu_category \n                       FROM order_details od \n                       JOIN menus m ON od.menu_id = m.id \n                       WHERE od.order_id IN ($placeholders)\";\n        $stmtDetails = $pdo->prepare($sqlDetails);\n        $stmtDetails->execute($orderIds);\n        $allDetails = $stmtDetails->fetchAll();\n\n        foreach ($allDetails as $detail) {\n            $orderDetailsMap[$detail['order_id']][] = $detail;\n        }\n    }\n} catch (PDOException $e) {\n    $orders = [];\n    $orderDetailsMap = [];\n}\n\n$pageTitle = 'Riwayat Pesanan Saya';\nrequire_once __DIR__ . '/../includes/header.php';\n?>\n\n<div class=\"d-flex justify-content-between align-items-center mb-4\">\n    <div>\n        <h2 class=\"fw-bold mb-1\"><i class=\"bi bi-clock-history me-2 text-warning\"><\/i>Riwayat Pesanan Saya<\/h2>\n        <p class=\"text-muted small mb-0\">Pantau status pesanan dan rincian transaksi cafe Anda<\/p>\n    <\/div>\n    <a href=\"<?php echo base_url('customer/order.php'); ?>\" class=\"btn btn-warning rounded-pill px-4 py-2 fw-bold shadow-sm\">\n        <i class=\"bi bi-bag-plus-fill me-1\"><\/i> Buat Pesanan Baru\n    <\/a>\n<\/div>\n\n<?php if (empty($orders)): ?>\n    <div class=\"card border-0 shadow-sm text-center py-5\">\n        <div class=\"card-body\">\n            <i class=\"bi bi-receipt fs-1 text-muted\"><\/i>\n            <h4 class=\"fw-bold mt-3 mb-1\">Belum Ada Riwayat Pesanan<\/h4>\n            <p class=\"text-muted small mb-4\">Anda belum pernah melakukan pemesanan di Taking Order Cafe.<\/p>\n            <a href=\"<?php echo base_url('customer/order.php'); ?>\" class=\"btn btn-warning rounded-pill px-4 py-2 fw-bold\">\n                Pesan Menu Sekarang\n            <\/a>\n        <\/div>\n    <\/div>\n<?php else: ?>\n    <div class=\"row g-4\">\n        <?php foreach ($orders as $order): ?>\n            <?php \n            $items = $orderDetailsMap[$order['id']] ?? []; \n            ?>\n            <div class=\"col-12\" id=\"order-<?php echo $order['id']; ?>\">\n                <div class=\"card border-0 shadow-sm overflow-hidden\">\n                    <div class=\"card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom\">\n                        <div class=\"d-flex align-items-center gap-3\">\n                            <span class=\"fs-5 fw-bold font-monospace text-dark\"><?php echo htmlspecialchars($order['order_code']); ?><\/span>\n                            <span class=\"text-muted small\">\n                                <i class=\"bi bi-calendar-event me-1\"><\/i> <?php echo date('d M Y, H:i', strtotime($order['created_at'])); ?> WIB\n                            <\/span>\n                        <\/div>\n                        <div class=\"d-flex align-items-center gap-2\">\n                            <?php echo render_status_badge($order['status']); ?>\n                        <\/div>\n                    <\/div>\n\n                    <div class=\"card-body p-0\">\n                        <div class=\"table-responsive\">\n                            <table class=\"table table-sm table-borderless align-middle mb-0\">\n                                <thead class=\"table-light border-bottom text-muted small\">\n                                    <tr>\n                                        <th class=\"ps-4\">Item Menu<\/th>\n                                        <th class=\"text-center\" style=\"width: 120px;\">Harga Satuan<\/th>\n                                        <th class=\"text-center\" style=\"width: 100px;\">Jumlah<\/th>\n                                        <th class=\"text-end pe-4\" style=\"width: 150px;\">Subtotal<\/th>\n                                    <\/tr>\n                                <\/thead>\n                                <tbody>\n                                    <?php foreach ($items as $item): ?>\n                                        <tr class=\"border-bottom\">\n                                            <td class=\"ps-4\">\n                                                <span class=\"fw-semibold text-dark\"><?php echo htmlspecialchars($item['menu_name']); ?><\/span>\n                                                <span class=\"badge bg-light text-secondary border ms-1 small\"><?php echo htmlspecialchars($item['menu_category']); ?><\/span>\n                                            <\/td>\n                                            <td class=\"text-center text-muted\"><?php echo format_rupiah($item['price']); ?><\/td>\n                                            <td class=\"text-center fw-bold\"><?php echo (int)$item['quantity']; ?>x<\/td>\n                                            <td class=\"text-end pe-4 fw-semibold\"><?php echo format_rupiah($item['subtotal']); ?><\/td>\n                                        <\/tr>\n                                    <?php endforeach; ?>\n                                <\/tbody>\n                            <\/table>\n                        <\/div>\n                    <\/div>\n\n                    <div class=\"card-footer bg-light py-3 px-4 d-flex justify-content-between align-items-center\">\n                        <div>\n                            <?php if ($order['status'] === 'Menunggu'): ?>\n                                <small class=\"text-muted\"><i class=\"bi bi-hourglass me-1\"><\/i> Pesanan sedang menunggu antrean barista.<\/small>\n                            <?php elseif ($order['status'] === 'Diproses'): ?>\n                                <small class=\"text-primary fw-semibold\"><i class=\"bi bi-fire me-1\"><\/i> Pesanan sedang dimasak/disiapkan!<\/small>\n                            <?php elseif ($order['status'] === 'Selesai'): ?>\n                                <small class=\"text-success fw-semibold\"><i class=\"bi bi-check-all me-1\"><\/i> Pesanan telah selesai disajikan. Selamat menikmati!<\/small>\n                            <?php else: ?>\n                                <small class=\"text-danger\"><i class=\"bi bi-x-circle me-1\"><\/i> Pesanan dibatalkan.<\/small>\n                            <?php endif; ?>\n                        <\/div>\n                        <div class=\"text-end\">\n                            <span class=\"text-muted small me-2\">Total Tagihan:<\/span>\n                            <span class=\"fs-5 fw-extrabold text-dark\"><?php echo format_rupiah($order['total']); ?><\/span>\n                        <\/div>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <?php endforeach; ?>\n    <\/div>\n<?php endif; ?>\n\n<?php require_once __DIR__ . '/../includes/footer.php'; ?>\n"}, {"path": "share-sistem-ukk/database.sql", "type": "text", "size": 5743, "content": "-- ==========================================================\n-- DATABASE: taking_order_cafe\n-- Aplikasi: Taking Order Cafe - UKK Asisten Pengembang Web\n-- ==========================================================\n\nCREATE DATABASE IF NOT EXISTS `taking_order_cafe` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\nUSE `taking_order_cafe`;\n\n-- ----------------------------------------------------------\n-- 1. Tabel users\n-- ----------------------------------------------------------\nCREATE TABLE IF NOT EXISTS `users` (\n    `id` INT AUTO_INCREMENT PRIMARY KEY,\n    `name` VARCHAR(100) NOT NULL,\n    `username` VARCHAR(50) NOT NULL UNIQUE,\n    `password` VARCHAR(255) NOT NULL,\n    `role` ENUM('admin', 'customer') NOT NULL DEFAULT 'customer',\n    `created_at` DATETIME DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ----------------------------------------------------------\n-- 2. Tabel menus\n-- ----------------------------------------------------------\nCREATE TABLE IF NOT EXISTS `menus` (\n    `id` INT AUTO_INCREMENT PRIMARY KEY,\n    `name` VARCHAR(100) NOT NULL,\n    `category` VARCHAR(50) NOT NULL, -- Makanan, Minuman, Snack\n    `description` TEXT,\n    `price` DECIMAL(10, 2) NOT NULL,\n    `image` VARCHAR(255) DEFAULT 'default-menu.png',\n    `status` ENUM('available', 'unavailable') NOT NULL DEFAULT 'available',\n    `created_at` DATETIME DEFAULT CURRENT_TIMESTAMP\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ----------------------------------------------------------\n-- 3. Tabel orders\n-- ----------------------------------------------------------\nCREATE TABLE IF NOT EXISTS `orders` (\n    `id` INT AUTO_INCREMENT PRIMARY KEY,\n    `order_code` VARCHAR(50) NOT NULL UNIQUE,\n    `user_id` INT NOT NULL,\n    `total` DECIMAL(12, 2) NOT NULL DEFAULT 0.00,\n    `status` ENUM('Menunggu', 'Diproses', 'Selesai', 'Dibatalkan') NOT NULL DEFAULT 'Menunggu',\n    `created_at` DATETIME DEFAULT CURRENT_TIMESTAMP,\n    CONSTRAINT `fk_orders_user` FOREIGN KEY (`user_id`) REFERENCES `users` (`id`) ON DELETE CASCADE ON UPDATE CASCADE\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ----------------------------------------------------------\n-- 4. Tabel order_details\n-- ----------------------------------------------------------\nCREATE TABLE IF NOT EXISTS `order_details` (\n    `id` INT AUTO_INCREMENT PRIMARY KEY,\n    `order_id` INT NOT NULL,\n    `menu_id` INT NOT NULL,\n    `price` DECIMAL(10, 2) NOT NULL,\n    `quantity` INT NOT NULL DEFAULT 1,\n    `subtotal` DECIMAL(12, 2) NOT NULL,\n    CONSTRAINT `fk_order_details_order` FOREIGN KEY (`order_id`) REFERENCES `orders` (`id`) ON DELETE CASCADE ON UPDATE CASCADE,\n    CONSTRAINT `fk_order_details_menu` FOREIGN KEY (`menu_id`) REFERENCES `menus` (`id`) ON DELETE RESTRICT ON UPDATE CASCADE\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;\n\n-- ----------------------------------------------------------\n-- Data Awal (Seed Data)\n-- Password default untuk 'admin' dan 'customer' adalah 'password'\n-- Hash: $2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi\n-- ----------------------------------------------------------\nINSERT INTO `users` (`id`, `name`, `username`, `password`, `role`, `created_at`) VALUES\n(1, 'Administrator Cafe', 'admin', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', 'admin', NOW()),\n(2, 'Andi Pratama', 'customer', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', 'customer', NOW()),\n(3, 'Budi Santoso', 'budi', '$2y$10$92IXUNpkjO0rOQ5byMi.Ye4oKoEa3Ro9llC/.og/at2.uheWG/igi', 'customer', NOW())\nON DUPLICATE KEY UPDATE `id`=`id`;\n\nINSERT INTO `menus` (`id`, `name`, `category`, `description`, `price`, `image`, `status`, `created_at`) VALUES\n(1, 'Nasi Goreng Spesial', 'Makanan', 'Nasi goreng dengan bumbu rempah khas, telur mata sapi, ayam suwir, dan kerupuk.', 22000.00, 'nasi-goreng.png', 'available', NOW()),\n(2, 'Mie Goreng Jawa', 'Makanan', 'Mie goreng gurih manis dengan bakso, sosis, sawi segar, dan taburan bawang goreng.', 18000.00, 'mie-goreng.png', 'available', NOW()),\n(3, 'Ayam Geprek Sambal Bawang', 'Makanan', 'Ayam krispi gurih dengan sambal bawang pedas nampol disajikan dengan nasi hangat.', 20000.00, 'ayam-geprek.png', 'available', NOW()),\n(4, 'Kentang Goreng Crispy', 'Snack', 'French fries renyah keemasan dengan taburan bumbu keju dan saus cocolan.', 15000.00, 'kentang-goreng.png', 'available', NOW()),\n(5, 'Roti Bakar Cokelat Keju', 'Snack', 'Roti bakar empuk isi limpahan cokelat manis dan parutan keju gurih.', 16000.00, 'roti-bakar.png', 'available', NOW()),\n(6, 'Es Kopi Susu Gula Aren', 'Minuman', 'Espresso arabika blend dipadu susu segar dan sirup gula aren pilihan.', 18000.00, 'kopi-susu.png', 'available', NOW()),\n(7, 'Matcha Latte Ice', 'Minuman', 'Teh hijau Jepang murni berpadu dengan susu creamy dan es batu menyegarkan.', 20000.00, 'matcha-latte.png', 'available', NOW()),\n(8, 'Es Teh Manis Jasmine', 'Minuman', 'Teh melati wangi segar disajikan dingin manis alami.', 6000.00, 'es-teh.png', 'available', NOW())\nON DUPLICATE KEY UPDATE `id`=`id`;\n\n-- Contoh Pesanan Awal untuk Demonstrasi\nINSERT INTO `orders` (`id`, `order_code`, `user_id`, `total`, `status`, `created_at`) VALUES\n(1, 'ORD-20260917-0001', 2, 40000.00, 'Selesai', NOW() - INTERVAL 1 DAY),\n(2, 'ORD-20260917-0002', 2, 38000.00, 'Diproses', NOW() - INTERVAL 2 HOUR),\n(3, 'ORD-20260917-0003', 3, 26000.00, 'Menunggu', NOW() - INTERVAL 10 MINUTE)\nON DUPLICATE KEY UPDATE `id`=`id`;\n\nINSERT INTO `order_details` (`id`, `order_id`, `menu_id`, `price`, `quantity`, `subtotal`) VALUES\n(1, 1, 1, 22000.00, 1, 22000.00),\n(2, 1, 6, 18000.00, 1, 18000.00),\n(3, 2, 3, 20000.00, 1, 20000.00),\n(4, 2, 6, 18000.00, 1, 18000.00),\n(5, 3, 7, 20000.00, 1, 20000.00),\n(6, 3, 8, 6000.00, 1, 6000.00)\nON DUPLICATE KEY UPDATE `id`=`id`;\n"}, {"path": "share-sistem-ukk/import_db.php", "type": "text", "size": 770, "content": "<?php\n$host = 'localhost';\n$user = 'root';\n$pass = '';\n\ntry {\n    $pdo = new PDO(\"mysql:host={$host}\", $user, $pass, [\n        PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION\n    ]);\n    \n    $sqlFile = __DIR__ . '/database.sql';\n    if (!file_exists($sqlFile)) {\n        die(\"File database.sql tidak ditemukan di {$sqlFile}\\n\");\n    }\n    \n    $sql = file_get_contents($sqlFile);\n    $pdo->exec($sql);\n    echo \"SUCCESS: Database `taking_order_cafe` berhasil dibuat dan diimpor lengkap dengan data awal!\\n\";\n    \n    // Verifikasi tabel\n    $tables = $pdo->query(\"SHOW TABLES FROM `taking_order_cafe`\")->fetchAll(PDO::FETCH_COLUMN);\n    echo \"Tabel yang terbentuk: \" . implode(', ', $tables) . \"\\n\";\n} catch (Exception $e) {\n    echo \"ERROR: \" . $e->getMessage() . \"\\n\";\n}\n"}, {"path": "share-sistem-ukk/includes/auth.php", "type": "text", "size": 2889, "content": "<?php\n/**\n * Auth Middleware & Session Guard\n * Mengatur perlindungan hak akses (Role Authorization) untuk Admin dan Customer.\n */\n\nif (session_status() === PHP_SESSION_NONE) {\n    session_start();\n}\n\n/**\n * Mengecek apakah pengguna sudah login\n */\nfunction is_logged_in() {\n    return isset($_SESSION['user']) && !empty($_SESSION['user']['id']);\n}\n\n/**\n * Mengembalikan data pengguna yang sedang login\n */\nfunction current_user() {\n    return is_logged_in() ? $_SESSION['user'] : null;\n}\n\n/**\n * Membatasi akses hanya untuk role tertentu.\n * Jika belum login -> diarahkan ke login.\n * Jika role tidak sesuai -> tampilkan peringatan forbidden.\n * \n * @param array|string $allowedRoles 'admin', 'customer', atau ['admin', 'customer']\n */\nfunction require_role($allowedRoles) {\n    if (!is_array($allowedRoles)) {\n        $allowedRoles = [$allowedRoles];\n    }\n    \n    // Jika belum login\n    if (!is_logged_in()) {\n        if (function_exists('set_flash_message')) {\n            set_flash_message('danger', 'Silakan login terlebih dahulu untuk mengakses halaman ini.');\n        }\n        $loginUrl = base_url('auth/login.php');\n        header(\"Location: {$loginUrl}\");\n        exit;\n    }\n    \n    $userRole = $_SESSION['user']['role'] ?? '';\n    \n    // Jika role tidak diizinkan\n    if (!in_array($userRole, $allowedRoles, true)) {\n        http_response_code(403);\n        ?>\n        <!DOCTYPE html>\n        <html lang=\"id\">\n        <head>\n            <meta charset=\"UTF-8\">\n            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n            <title>403 - Akses Ditolak<\/title>\n            <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\" rel=\"stylesheet\">\n            <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css\">\n        <\/head>\n        <body class=\"bg-light d-flex align-items-center min-vh-100\">\n            <div class=\"container text-center\">\n                <div class=\"card shadow-sm border-0 p-5 mx-auto\" style=\"max-width: 500px; border-radius: 16px;\">\n                    <div class=\"mb-3 text-danger\">\n                        <i class=\"bi bi-shield-lock-fill\" style=\"font-size: 4rem;\"><\/i>\n                    <\/div>\n                    <h2 class=\"fw-bold mb-2\">Akses Ditolak<\/h2>\n                    <p class=\"text-muted mb-4\">Anda tidak memiliki hak akses untuk membuka halaman ini.<\/p>\n                    <div>\n                        <a href=\"<?php echo base_url($userRole === 'admin' ? 'admin/dashboard.php' : 'customer/dashboard.php'); ?>\" class=\"btn btn-primary px-4 py-2 rounded-pill\">\n                            <i class=\"bi bi-arrow-left me-1\"><\/i> Kembali ke Dashboard\n                        <\/a>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/body>\n        <\/html>\n        <?php\n        exit;\n    }\n}\n"}, {"path": "share-sistem-ukk/includes/footer.php", "type": "text", "size": 1145, "content": "        <\/div>\n    <\/main>\n\n    <!-- Footer -->\n    <footer class=\"bg-white border-top py-4 mt-auto\">\n        <div class=\"container text-center text-muted small\">\n            <div class=\"row align-items-center\">\n                <div class=\"col-md-6 text-md-start mb-2 mb-md-0\">\n                    <p class=\"mb-0 fw-medium\">\n                        &copy; <?php echo date('Y'); ?> <strong class=\"text-dark\">Taking Order Cafe<\/strong>. Dibuat untuk Uji Kompetensi Keahlian (UKK).\n                    <\/p>\n                <\/div>\n                <div class=\"col-md-6 text-md-end\">\n                    <span class=\"badge bg-light text-secondary border px-3 py-2\">\n                        <i class=\"bi bi-code-slash me-1\"><\/i> Asisten Pengembang Web (PHP + Bootstrap 5)\n                    <\/span>\n                <\/div>\n            <\/div>\n        <\/div>\n    <\/footer>\n\n    <!-- Bootstrap 5 JS Bundle (Popper included) -->\n    <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js\"><\/script>\n    <!-- Custom JavaScript -->\n    <script src=\"<?php echo base_url('assets/js/script.js'); ?>\"><\/script>\n<\/body>\n<\/html>\n"}, {"path": "share-sistem-ukk/includes/functions.php", "type": "text", "size": 5455, "content": "<?php\n/**\n * Helper Functions Aplikasi Taking Order Cafe\n * Berisi kumpulan fungsi utilitas yang digunakan di seluruh sistem.\n */\n\n// Memulai session jika belum aktif\nif (session_status() === PHP_SESSION_NONE) {\n    session_start();\n}\n\n/**\n * Mengembalikan Base URL aplikasi agar path asset & link selalu konsisten\n */\nfunction base_url($path = '') {\n    static $base = null;\n    if ($base === null) {\n        $docRoot = isset($_SERVER['DOCUMENT_ROOT']) ? str_replace('\\\\', '/', realpath($_SERVER['DOCUMENT_ROOT'])) : '';\n        $appRoot = str_replace('\\\\', '/', realpath(__DIR__ . '/..'));\n        \n        if (!empty($docRoot) && strpos($appRoot, $docRoot) === 0) {\n            $base = substr($appRoot, strlen($docRoot));\n        } else {\n            // Fallback jika dijalankan via PHP CLI Server atau path khusus\n            $scriptDir = str_replace('\\\\', '/', dirname($_SERVER['SCRIPT_NAME'] ?? ''));\n            $parts = explode('/', trim($scriptDir, '/'));\n            $base = isset($parts[0]) && $parts[0] !== '' ? '/' . $parts[0] : '';\n        }\n        $base = '/' . trim($base, '/');\n        if ($base === '/') {\n            $base = '';\n        }\n    }\n    return $base . '/' . ltrim($path, '/');\n}\n\n/**\n * Membersihkan input untuk mencegah serangan XSS (Cross-Site Scripting)\n */\nfunction sanitize($data) {\n    if (is_array($data)) {\n        return array_map('sanitize', $data);\n    }\n    return htmlspecialchars(trim((string)$data), ENT_QUOTES, 'UTF-8');\n}\n\n/**\n * Format angka menjadi format mata uang Rupiah (contoh: Rp 22.000)\n */\nfunction format_rupiah($number) {\n    return 'Rp ' . number_format((float)$number, 0, ',', '.');\n}\n\n/**\n * Menghasilkan kode pesanan unik berformat ORD-YYYYMMDD-XXXX\n */\nfunction generate_order_code($pdo) {\n    $datePrefix = 'ORD-' . date('Ymd') . '-';\n    \n    // Cari urutan terakhir pada hari ini\n    $stmt = $pdo->prepare(\"SELECT order_code FROM orders WHERE order_code LIKE ? ORDER BY id DESC LIMIT 1\");\n    $stmt->execute([$datePrefix . '%']);\n    $lastOrder = $stmt->fetch();\n    \n    if ($lastOrder) {\n        $lastNumber = (int)substr($lastOrder['order_code'], -4);\n        $nextNumber = $lastNumber + 1;\n    } else {\n        $nextNumber = 1;\n    }\n    \n    return $datePrefix . str_pad($nextNumber, 4, '0', STR_PAD_LEFT);\n}\n\n/**\n * Menghasilkan badge HTML Bootstrap sesuai status pesanan\n */\nfunction render_status_badge($status) {\n    $badgeClass = 'bg-secondary';\n    $icon = 'bi-clock';\n    \n    switch ($status) {\n        case 'Menunggu':\n            $badgeClass = 'bg-warning text-dark';\n            $icon = 'bi-hourglass-split';\n            break;\n        case 'Diproses':\n            $badgeClass = 'bg-primary text-white';\n            $icon = 'bi-arrow-repeat';\n            break;\n        case 'Selesai':\n            $badgeClass = 'bg-success text-white';\n            $icon = 'bi-check-circle-fill';\n            break;\n        case 'Dibatalkan':\n            $badgeClass = 'bg-danger text-white';\n            $icon = 'bi-x-circle-fill';\n            break;\n    }\n    \n    return '<span class=\"badge ' . $badgeClass . ' px-3 py-2 rounded-pill\"><i class=\"bi ' . $icon . ' me-1\"><\/i> ' . htmlspecialchars($status) . '<\/span>';\n}\n\n/**\n * Mengembalikan URL gambar menu, otomatis mencari file gambar yang diupload atau default SVG\n */\nfunction get_menu_image_url($imageName) {\n    if (empty($imageName)) {\n        return base_url('assets/img/default-menu.svg');\n    }\n    \n    $imgPath = __DIR__ . '/../assets/img/' . $imageName;\n    if (file_exists($imgPath)) {\n        return base_url('assets/img/' . $imageName);\n    }\n    \n    $baseName = pathinfo($imageName, PATHINFO_FILENAME);\n    $svgPath = __DIR__ . '/../assets/img/' . $baseName . '.svg';\n    if (file_exists($svgPath)) {\n        return base_url('assets/img/' . $baseName . '.svg');\n    }\n    \n    $pngPath = __DIR__ . '/../assets/img/' . $baseName . '.png';\n    if (file_exists($pngPath)) {\n        return base_url('assets/img/' . $baseName . '.png');\n    }\n    \n    return base_url('assets/img/default-menu.svg');\n}\n\n/**\n * Set flash message untuk feedback notifikasi (success, danger, warning, info)\n */\nfunction set_flash_message($type, $message) {\n    $_SESSION['flash_message'] = [\n        'type'    => $type,\n        'message' => $message\n    ];\n}\n\n/**\n * Menampilkan dan membersihkan flash message jika ada\n */\nfunction render_flash_message() {\n    if (isset($_SESSION['flash_message'])) {\n        $flash = $_SESSION['flash_message'];\n        $type = htmlspecialchars($flash['type']);\n        // Izinkan tag pemformatan aman (strong, b, em, code, i) agar elemen HTML dirender dengan benar\n        $msg = strip_tags($flash['message'], '<strong><b><em><code><i><small><span>');\n        \n        $icon = 'bi-info-circle';\n        if ($type === 'success') {\n            $icon = 'bi-check-circle-fill';\n        } elseif ($type === 'danger') {\n            $icon = 'bi-exclamation-octagon-fill';\n        } elseif ($type === 'warning') {\n            $icon = 'bi-exclamation-triangle-fill';\n        }\n        \n        echo '<div class=\"alert alert-' . $type . ' alert-dismissible fade show my-3 shadow-sm d-flex align-items-center\" role=\"alert\">';\n        echo '<i class=\"bi ' . $icon . ' fs-5 me-2\"><\/i>';\n        echo '<div>' . $msg . '<\/div>';\n        echo '<button type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Close\"><\/button>';\n        echo '<\/div>';\n        \n        unset($_SESSION['flash_message']);\n    }\n}\n"}, {"path": "share-sistem-ukk/includes/header.php", "type": "text", "size": 9481, "content": "<?php\nif (!isset($pageTitle)) {\n    $pageTitle = 'Taking Order Cafe';\n}\n$currentUser = function_exists('current_user') ? current_user() : null;\n$role = $currentUser['role'] ?? 'guest';\n$currentScript = basename($_SERVER['PHP_SELF']);\n?>\n<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <meta name=\"description\" content=\"Taking Order Cafe - Sistem Pemesanan Cafe Berbasis Web untuk UKK Asisten Pengembang Web\">\n    <title><?php echo htmlspecialchars($pageTitle); ?> - Taking Order Cafe<\/title>\n    \n    <!-- Google Fonts: Plus Jakarta Sans -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n    \n    <!-- Bootstrap 5 CSS -->\n    <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\" rel=\"stylesheet\">\n    <!-- Bootstrap Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css\">\n    <!-- Custom CSS -->\n    <link rel=\"stylesheet\" href=\"<?php echo base_url('assets/css/style.css'); ?>\">\n<\/head>\n<body class=\"d-flex flex-column min-vh-100 bg-light\">\n\n    <!-- Top Navigation Bar -->\n    <nav class=\"navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2\">\n        <div class=\"container\">\n            <a class=\"navbar-brand d-flex align-items-center gap-2 fw-bold\" href=\"<?php \n                if ($role === 'admin') echo base_url('admin/dashboard.php');\n                elseif ($role === 'customer') echo base_url('customer/dashboard.php');\n                else echo base_url('app.php');\n            ?>\">\n                <span class=\"brand-icon bg-warning text-dark d-inline-flex align-items-center justify-content-center rounded-circle p-2 shadow-sm\">\n                    <i class=\"bi bi-cup-hot-fill fs-5\"><\/i>\n                <\/span>\n                <span class=\"fs-5 tracking-tight\">Taking Order <span class=\"text-warning\">Cafe<\/span><\/span>\n            <\/a>\n\n            <button class=\"navbar-toggler border-0\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#navbarMain\" aria-controls=\"navbarMain\" aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n                <span class=\"navbar-toggler-icon\"><\/span>\n            <\/button>\n\n            <div <script>
(function(){
var FILES=JSON.parse(document.getElementById('data').textContent);
var $=function(i){return document.getElementById(i)};
var EXT={php:'#777bb3',sql:'#e48e00',css:'#2965f1',js:'#d9b300',svg:'#ff9a00',jpg:'#12a37f'};
var LANG={php:'php',sql:'sql',css:'css',js:'javascript',svg:'xml'};
var ext=function(p){var m=/\.([a-z0-9]+)$/i.exec(p);return m?m[1].toLowerCase():''};
var esc=function(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var fmt=function(n){return n<1024?n+' B':(n/1024).toFixed(1)+' KB'};
var root={dirs:{},files:[]},byPath={},cur=null,mode='code';
FILES.forEach(function(f){byPath[f.path]=f;var parts=f.path.split('/'),n=root;
 for(var i=0;i<parts.length-1;i++){n=n.dirs[parts[i]]=n.dirs[parts[i]]||{dirs:{},files:[],name:parts[i]}}
 n.files.push(f)});
function filesIn(prefix){return FILES.filter(function(f){return f.path.indexOf(prefix)===0&&f.type==='text'})}
function toast(m){var t=$('toast');t.textContent=m||'Tersalin ✓';t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},1600)}
function copy(txt,msg){
 function fb(){var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Gagal menyalin')}a.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(msg)},fb)}else fb()}
function fileRow(f){
 var d=document.createElement('div'),r=document.createElement('div');r.className='row';r.dataset.p=f.path;
 var e=ext(f.path);
 r.innerHTML='<span class="caret"></span><span class="dot" style="background:'+(EXT[e]||'')+'"></span><span class="nm">'+esc(f.path.split('/').pop())+'</span>';
 r.onclick=function(){openFile(f.path);document.body.classList.remove('nav')};d.appendChild(r);return d}
function dirNode(n,prefix,open){
 var d=document.createElement('div');if(open)d.className='open';
 var r=document.createElement('div');r.className='row';
 r.innerHTML='<span class="caret">▸</span><span class="ic">📂</span><span class="nm">'+esc(n.name)+'</span><button class="cp" title="Salin semua file di folder ini">salin</button>';
 var k=document.createElement('div');k.className='kids';
 r.onclick=function(e){if(e.target.className==='cp'){var fs=filesIn(prefix);copy(fs.map(function(f){return'/* ===== '+f.path+' ===== */\n'+f.content}).join('\n\n'),fs.length+' file tersalin ✓');return}d.classList.toggle('open')};
 d.appendChild(r);d.appendChild(k);fill(n,prefix,k);return d}
function fill(n,prefix,k){
 Object.keys(n.dirs).sort().forEach(function(name){k.appendChild(dirNode(n.dirs[name],prefix+name+'/',prefix===''))});
 n.files.sort(function(a,b){return a.path<b.path?-1:1}).forEach(function(f){k.appendChild(fileRow(f))})}
function renderTree(){var t=$('tree');t.innerHTML='';fill(root,'',t);mark()}
function mark(){Array.prototype.forEach.call(document.querySelectorAll('.row[data-p]'),function(r){r.classList.toggle('on',r.dataset.p===cur)})}
function openFile(p){cur=p;var f=byPath[p];mark();$('crumb').textContent=p;
 var e=ext(p),isImg=f.type==='image',isSvg=e==='svg';
 $('meta').textContent=fmt(f.size)+(f.type==='text'?' · '+f.content.split('\n').length+' baris':'');
 $('copy').style.display=f.type==='text'?'':'none';
 $('seg').innerHTML=isSvg?'<span class="seg"><button data-m="code">Kode</button><button data-m="pv">Pratinjau</button></span>':'';
 if(isSvg){mode=mode==='pv'?'pv':'code';Array.prototype.forEach.call($('seg').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.m===mode);b.onclick=function(){mode=b.dataset.m;openFile(p)}})}
 var v=$('view');v.scrollTop=0;
 if(isImg){v.innerHTML='<div class="pv"><img alt=""></div>';v.querySelector('img').src=f.content;return}
 if(isSvg&&mode==='pv'){v.innerHTML='<div class="pv"><img alt=""></div>';v.querySelector('img').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(f.content);return}
 var lines=f.content.split('\n'),html;
 try{html=LANG[e]&&window.hljs?hljs.highlight(f.content,{language:LANG[e],ignoreIllegals:true}).value:esc(f.content)}catch(x){html=esc(f.content)}
 var g=[];for(var i=1;i<=lines.length;i++)g.push(i);
 v.innerHTML='<div class="code"><pre class="gut">'+g.join('\n')+'</pre><pre class="src"><code>'+html+'</code></pre></div>'}
$('copy').onclick=function(){if(cur)copy(byPath[cur].content,'Kode tersalin ✓')};
$('menu').onclick=function(){document.body.classList.toggle('nav')};
$('theme').onclick=function(){var r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
var allOpen=false;$('expand').onclick=function(){allOpen=!allOpen;Array.prototype.forEach.call(document.querySelectorAll('#tree .kids'),function(k){k.parentNode.classList.toggle('open',allOpen)})};
$('q').oninput=function(){var s=this.value.trim().toLowerCase();if(!s){renderTree();return}
 var t=$('tree');t.innerHTML='';FILES.filter(function(f){return f.path.toLowerCase().indexOf(s)>-1}).forEach(function(f){var d=fileRow(f);d.querySelector('.nm').textContent=f.path;t.appendChild(d)});mark()};
function home(){var lines=0,dirs={};FILES.forEach(function(f){if(f.type==='text')lines+=f.content.split('\n').length;var p=f.path.split('/');p.pop();var a='';p.forEach(function(x){a+=x+'/';dirs[a]=1})});
 var tot=FILES.reduce(function(a,f){return a+f.size},0);
 $('view').innerHTML='<div class="empty"><h2>Selamat datang 👋</h2>Pilih file di panel kiri untuk melihat kodenya. Tombol <b>Salin kode</b> menyalin satu file; tombol <b>salin</b> di samping nama folder menyalin semua file teks di dalamnya.<div class="stats"><div class="stat"><b>'+FILES.length+'</b>file</div><div class="stat"><b>'+Object.keys(dirs).length+'</b>folder</div><div class="stat"><b>'+lines.toLocaleString('id-ID')+'</b>baris kode</div><div class="stat"><b>'+fmt(tot)+'</b>total</div></div><button class="pri" id="all">Salin seluruh proyek</button></div>';
 $('all').onclick=function(){var fs=filesIn('');copy(fs.map(function(f){return'/* ===== '+f.path+' ===== */\n'+f.content}).join('\n\n'),fs.length+' file tersalin ✓')}}
renderTree();home();
})();
</script>
</body>
</html>
